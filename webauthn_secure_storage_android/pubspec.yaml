name: webauthn_secure_storage_android
description: Android implementation of the webauthn_secure_storage federated plugin.
version: 0.2.1
homepage: https://github.com/JohnGalt1717/webauthn_secure_storage

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  webauthn_secure_storage_platform_interface: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  plugin:
    implements: webauthn_secure_storage
    platforms:
      android:
        package: design.codeux.webauthn_secure_storage
        pluginClass: BiometricStoragePlugin
        dartPluginClass: BiometricStorageAndroid
